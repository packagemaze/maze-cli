version: 2.1

# All maze-cli builds run on CircleCI. Every branch push runs the Linux
# lint/test job, the native Windows test job, and a full release-asset
# cross-compile. Pushing a v* tag additionally publishes the rebuilt assets
# to the GitHub release for that tag; publication is gated on the Linux and
# Windows test jobs.
#
# The publish job needs the `maze-cli-release` CircleCI context to provide
# GH_TOKEN, a GitHub credential with contents:write on packagemaze/maze-cli.

jobs:
  lint-and-test-linux:
    docker:
      - image: cimg/go:1.26
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-build-v1-{{ checksum "go.sum" }}
            - go-build-v1-
      - run:
          name: Download modules
          command: go mod download
      - run:
          name: Format
          command: test -z "$(gofmt -l $(find . -name '*.go' -not -path './bin/*'))"
      - run:
          name: Vet
          command: |
            go vet ./...
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go vet ./...
      - run:
          name: Test
          command: go test ./...
      - run:
          name: Build
          command: go build -o bin/maze ./cmd/maze
      - save_cache:
          key: go-build-v1-{{ checksum "go.sum" }}
          paths:
            - /home/circleci/go/pkg/mod
            - /home/circleci/.cache/go-build

  test-windows:
    machine:
      image: windows-server-2022-gui:current
    resource_class: windows.medium
    shell: bash.exe
    steps:
      - checkout
      - run:
          name: Install Go toolchain from go.mod
          command: |
            set -euo pipefail
            go_version="$(sed -n 's/^toolchain go//p' go.mod | head -n 1)"
            if [ -z "$go_version" ]; then
              go_version="$(sed -n 's/^go //p' go.mod | head -n 1)"
            fi
            curl -fsSL --retry 3 -o "$HOME/go-toolchain.zip" \
              "https://go.dev/dl/go${go_version}.windows-amd64.zip"
            powershell.exe -NoProfile -NonInteractive -Command \
              "Expand-Archive -Force -Path '$(cygpath -w "$HOME/go-toolchain.zip")' -DestinationPath '$(cygpath -w "$HOME/go-toolchain")'"
            "$HOME/go-toolchain/go/bin/go" version
      - run:
          name: Test
          command: |
            set -euo pipefail
            export PATH="$HOME/go-toolchain/go/bin:$PATH"
            go test ./...
      - run:
          name: Build and smoke test
          command: |
            set -euo pipefail
            export PATH="$HOME/go-toolchain/go/bin:$PATH"
            go build -o bin/maze.exe ./cmd/maze
            ./bin/maze.exe version

  build-release-assets:
    docker:
      - image: cimg/go:1.26
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-build-v1-{{ checksum "go.sum" }}
            - go-build-v1-
      - run:
          name: Ensure archive tooling
          command: |
            command -v zip >/dev/null 2>&1 || {
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends zip
            }
      - run:
          name: Build release archives
          command: |
            export RELEASE_TAG="${CIRCLE_TAG:-v0.0.0-dev}"
            export RELEASE_COMMIT="$CIRCLE_SHA1"
            bash scripts/build-release-assets.sh
      - store_artifacts:
          path: dist
      - persist_to_workspace:
          root: .
          paths:
            - dist

  publish-github-release:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install GitHub CLI
          command: |
            sudo mkdir -p -m 755 /etc/apt/keyrings
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
              | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
            sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gh jq
      - run:
          name: Publish release assets
          command: |
            : "${GH_TOKEN:?GH_TOKEN must be provided by the maze-cli-release context}"
            export RELEASE_TAG="$CIRCLE_TAG"
            export VERSION="${CIRCLE_TAG#v}"
            export RELEASE_COMMIT="$CIRCLE_SHA1"
            export RELEASE_REPOSITORY="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            bash scripts/publish-release.sh

workflows:
  build-test-release:
    jobs:
      - lint-and-test-linux:
          filters: &run-on-branches-and-release-tags
            tags:
              only: /^v.*/
      - test-windows:
          filters: *run-on-branches-and-release-tags
      - build-release-assets:
          filters: *run-on-branches-and-release-tags
      - publish-github-release:
          context: maze-cli-release
          requires:
            - lint-and-test-linux
            - test-windows
            - build-release-assets
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
