name: Release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/test.yml
      - scripts/**
      - cmd/**
      - docs/**
      - internal/**
      - tests/**
      - go.mod
      - go.sum
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to cut from main (v*); the tag is created by the release itself"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    needs: test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - id: version
        name: Resolve release version
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              printf 'maze CLI dispatch releases must run from main, not %s\n' "$GITHUB_REF" >&2
              exit 1
            fi
            release_tag="$DISPATCH_RELEASE_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="v0.0.0-dev"
          fi
          case "$release_tag" in
            v*) ;;
            *) printf 'maze CLI release tags must use v*: %s\n' "$release_tag" >&2; exit 1 ;;
          esac
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            peeled="$(git ls-remote origin "refs/tags/${release_tag}^{}" | cut -f1)"
            plain="$(git ls-remote origin "refs/tags/${release_tag}" | cut -f1)"
            existing="${peeled:-$plain}"
            if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
              printf 'tag %s already exists at %s, not the dispatched commit %s\n' \
                "$release_tag" "$existing" "$GITHUB_SHA" >&2
              exit 1
            fi
          fi
          version="${release_tag#v}"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build release archives
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: bash scripts/build-release-assets.sh

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: maze-cli-release-assets
          path: dist/*
          if-no-files-found: error

  release:
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/download-artifact@v8.0.1
        with:
          name: maze-cli-release-assets
          path: dist

      - uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-checksums: dist/maze_checksums.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: bash scripts/publish-release.sh
